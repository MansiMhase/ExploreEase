                                </div>
                          <div class="col-md-6">

                                        <!--<input type="text" class="form-control bg-transparent datetimepicker-input" id="datetime" placeholder="Date & Time" data-target="#date3" data-toggle="datetimepicker" />-->
                                        
					<select class="form-select bg-transparent" id="select2">
                                            <option value="1">less than 7 days</option>

                                            <option value="3">More than 2 weeks </option>
                                        </select>
					<label for="select2">Duration</label>
                                    </div>
                                </div>

                                    <div class="form-floating">

                                            <option value="3">Hill Station</option>
                                        </select>
                                        <label for="select3">category</label>
                                    </div>
                                </div>
                            <div class="col-md-6">
                                    <div class="form-floating">

                                            <option value="1">Summer</option>
                                            <option value="2">Winter</option>
                                            <option value="3">Rainy</option>
                                        </select>
                                        <label for="select3">Season</label>
                                    </div>
                                </div>
                            
                                <div class="col-12">
                                    <button class="btn btn-outline-light w-100 py-3" type="submit" onclick="submit()">Show</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

<script>
        function updateBudgetDropdown() {
            var destinationSelect = document.getElementById("destination");
            var budgetSelect = document.getElementById("budget");

            // Clear existing options
            budgetSelect.innerHTML = "";

            // Get selected destination
            var selectedDestination = destinationSelect.value;

            // Populate budget options based on the selected destination
            switch (selectedDestination) {
                case "mumbai":
                    addBudgetOption("30000");
                    addBudgetOption("40000");
                    break;
                case "Pune":
                    addBudgetOption("2000");
                    addBudgetOption("5000");
                    addBudgetOption("2500");
                    break;
                case "Kolkatta":
                    addBudgetOption("30000");
                    addBudgetOption("15000");
                    break;
                // Add cases for other destinations as needed
                default:
                    addBudgetOption("Unknown");
            }

            // Function to add an option to the budget dropdown
            function addBudgetOption(value) {
                var option = document.createElement("option");
                option.value = value;
                option.text = value;
                budgetSelect.add(option);
            }


    </script>
